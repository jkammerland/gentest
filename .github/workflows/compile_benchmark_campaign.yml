name: compile-benchmark-campaign

on:
  workflow_dispatch:
    inputs:
      samples:
        description: Timed samples per compiler/cap lane (manual workflow defaults to a bounded smoke matrix)
        required: false
        default: "1"
      warmups:
        description: Untimed warmups per compiler/cap lane
        required: false
        default: "0"
      codegen_caps:
        description: Comma-separated gentest_codegen caps; auto maps to 0
        required: false
        default: "1,4,auto"

permissions:
  contents: read

jobs:
  benchmark:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    container: ubuntu:24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Clang 22 primary
            cc: clang-22
            cxx: clang++-22
          - name: GCC 16 secondary
            cc: gcc-16
            cxx: g++-16
    steps:
      - name: Install pinned compiler and host-codegen dependencies
        run: |
          set -euxo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl gnupg software-properties-common \
            git ninja-build python3 python3-pip pkg-config \
            build-essential ccache \
            libffi-dev libxml2-dev zlib1g-dev libzstd-dev libcurl4-openssl-dev libunwind-dev libfmt-dev
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key | tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc >/dev/null
          printf '%s\n' \
            'Types: deb' \
            'URIs: https://apt.llvm.org/noble/' \
            'Suites: llvm-toolchain-noble-22' \
            'Components: main' \
            'Signed-By: /etc/apt/trusted.gpg.d/apt.llvm.org.asc' \
            >/etc/apt/sources.list.d/apt-llvm-22.sources
          add-apt-repository -y ppa:ubuntu-toolchain-r/test
          apt-get update
          apt-get install -y --no-install-recommends \
            clang-22 clang-tools-22 libclang-22-dev libclang-cpp22-dev llvm-22-dev \
            gcc-16 g++-16
          python3 -m pip install --break-system-packages --upgrade cmake ninja

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run bounded campaign or report unavailable compiler
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
          LLVM_DIR: /usr/lib/llvm-22/lib/cmake/llvm
          Clang_DIR: /usr/lib/llvm-22/lib/cmake/clang
        run: |
          set -euxo pipefail
          output_dir="${RUNNER_TEMP}/compile-campaign-${{ matrix.cc }}"
          python3 scripts/bench_compile_campaign.py \
            --cc "${CC}" --cxx "${CXX}" \
            --samples "${{ inputs.samples }}" --warmups "${{ inputs.warmups }}" \
            --codegen-caps "${{ inputs.codegen_caps }}" \
            --lanes one-tu,eight-tu-one-binary,eight-tu-eight-binary,repo-e2e,runtime \
            --include-surfaces legacy,narrow \
            --output-dir "${output_dir}" \
            --allow-unavailable
          if [ -f "${output_dir}/summary.md" ]; then
            cat "${output_dir}/summary.md" >> "$GITHUB_STEP_SUMMARY"
          elif [ -f "${output_dir}/result.json" ]; then
            printf '## %s\n\n```json\n' "${{ matrix.name }}" >> "$GITHUB_STEP_SUMMARY"
            cat "${output_dir}/result.json" >> "$GITHUB_STEP_SUMMARY"
            printf '\n```\n' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: compile-campaign-${{ matrix.cc }}
          path: |
            ${{ runner.temp }}/compile-campaign-${{ matrix.cc }}/result.json
            ${{ runner.temp }}/compile-campaign-${{ matrix.cc }}/summary.md
          if-no-files-found: warn
