name: buildsystems-linux

'on':
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CCACHE_DISABLE: 1
  BAZELISK_VERSION: "v1.29.0"
  XMAKE_VERSION: "3.0.8"

jobs:
  plan:
    name: Buildsystems • plan
    runs-on: ubuntu-24.04
    outputs:
      run_bazel: ${{ steps.plan.outputs.run_bazel }}
      run_meson: ${{ steps.plan.outputs.run_meson }}
      run_xmake: ${{ steps.plan.outputs.run_xmake }}
    steps:
      - name: Checkout planner and history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Compute CI plan
        id: plan
        env:
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_REF: ${{ github.ref }}
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          ci_plan_script="scripts/ci_plan.py"
          if [ "${CI_EVENT_NAME}" = "pull_request" ]; then
            ci_plan_script="${RUNNER_TEMP}/ci_plan.py"
            if ! git show "${CI_BASE_SHA}:scripts/ci_plan.py" > "${ci_plan_script}"; then
              ci_plan_script=""
            fi
          fi
          if [ -z "${ci_plan_script}" ] || ! python3 "${ci_plan_script}" \
            --event "${CI_EVENT_NAME}" \
            --ref "${CI_REF}" \
            --base "${CI_BASE_SHA}" \
            --head "${CI_HEAD_SHA}" \
            --github-output "${GITHUB_OUTPUT}"
          then
            echo "CI planner failed; enabling all lanes." >&2
            for lane in cmake lint coverage cross_qemu bazel meson xmake; do
              printf 'run_%s=true\n' "${lane}" >> "${GITHUB_OUTPUT}"
            done
          fi

  bazel:
    needs: plan
    if: ${{ needs.plan.outputs.run_bazel == 'true' }}
    name: Bazel • ${{ matrix.name }}
    runs-on: ubuntu-24.04
    container: ${{ matrix.container }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu 24.04
            container: ubuntu:24.04
            pkg_manager: apt
            clang_version: "20"
          - name: Fedora 43
            container: fedora:43
            pkg_manager: dnf
            clang_version: "20"
    steps:
      - &install_deps_apt
        name: Install dependencies (apt)
        if: ${{ matrix.pkg_manager == 'apt' }}
        run: |
          set -euxo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt_common_opts=(-o Acquire::Retries=5 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
          apt_update_opts=("${apt_common_opts[@]}" -o APT::Update::Error-Mode=any)
          apt_update() {
            for attempt in 1 2 3 4 5; do
              apt-get "${apt_update_opts[@]}" update && return 0
              apt-get clean
              rm -rf /var/lib/apt/lists/*
              sleep $((attempt * 10))
            done
            apt-get "${apt_update_opts[@]}" update
          }
          apt_install() {
            for attempt in 1 2 3 4 5; do
              apt-get "${apt_common_opts[@]}" install -y --no-install-recommends "$@" && return 0
              apt-get clean
              rm -rf /var/lib/apt/lists/*
              sleep $((attempt * 10))
              apt_update
            done
            apt-get "${apt_common_opts[@]}" install -y --no-install-recommends "$@"
          }
          apt_update
          apt_install \
            git \
            build-essential \
            ninja-build \
            python3 \
            python3-pip \
            pkg-config \
            curl \
            zip \
            unzip \
            tar \
            ca-certificates \
            libffi-dev \
            libxml2-dev \
            zlib1g-dev \
            libzstd-dev \
            libcurl4-openssl-dev \
            libunwind-dev \
            libfmt-dev \
            clang-${{ matrix.clang_version }} \
            clang-tools-${{ matrix.clang_version }} \
            libclang-${{ matrix.clang_version }}-dev \
            libclang-cpp${{ matrix.clang_version }}-dev \
            llvm-${{ matrix.clang_version }}-dev \
            meson
          python3 -m pip install --break-system-packages --upgrade cmake
          echo "/usr/lib/llvm-${{ matrix.clang_version }}/bin" >> "$GITHUB_PATH"
      - &install_deps_dnf
        name: Install dependencies (dnf)
        if: ${{ matrix.pkg_manager == 'dnf' }}
        run: |
          set -euxo pipefail
          dnf -y upgrade --refresh
          dnf -y install \
            git \
            which \
            tar \
            xz \
            ninja-build \
            python3 \
            python3-pip \
            pkg-config \
            curl \
            zip \
            unzip \
            clang \
            clang-libs \
            clang-devel \
            clang-tools-extra \
            llvm-devel \
            fmt-devel \
            zlib-ng-compat-devel \
            libunwind-devel \
            libcurl-devel \
            libffi-devel \
            libxml2-devel \
            gcc \
            gcc-c++ \
            make \
            ca-certificates \
            meson \
            xmake
          python3 -m pip install --upgrade pip cmake

      - &checkout
        name: Checkout
        uses: actions/checkout@v6

      - name: Install Bazelisk
        run: |
          set -euxo pipefail
          arch="$(uname -m)"
          case "$arch" in
            x86_64) bazelisk_arch="amd64" ;;
            aarch64) bazelisk_arch="arm64" ;;
            *) echo "Unsupported arch: $arch"; exit 1 ;;
          esac

          asset="bazelisk-linux-${bazelisk_arch}"
          base_url="https://github.com/bazelbuild/bazelisk/releases/download/${BAZELISK_VERSION}"
          work_dir="$(mktemp -d)"
          trap 'rm -rf "${work_dir}"' EXIT
          cd "${work_dir}"

          curl --fail --location --show-error --retry 5 --retry-all-errors \
            -o "${asset}" "${base_url}/${asset}"
          curl --fail --location --show-error --retry 5 --retry-all-errors \
            -o "${asset}.sha256" "${base_url}/${asset}.sha256"
          expected_sha256="$(tr -d '[:space:]' < "${asset}.sha256")"
          actual_sha256="$(sha256sum "${asset}")"
          actual_sha256="${actual_sha256%% *}"
          if [[ ! "${expected_sha256}" =~ ^[0-9a-fA-F]{64}$ ]] || [[ "${actual_sha256}" != "${expected_sha256,,}" ]]; then
            echo "Bazelisk checksum mismatch for ${asset}" >&2
            echo "expected: ${expected_sha256}" >&2
            echo "actual:   ${actual_sha256}" >&2
            exit 1
          fi

          install -m 0755 "${asset}" /usr/local/bin/bazelisk
          ln -sf /usr/local/bin/bazelisk /usr/local/bin/bazel
          bazel --version

      - name: Test
        env:
          BAZELISK_GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          host_clang_c="$(command -v clang)"
          host_clang="$(command -v clang++)"
          export CC="${host_clang_c}"
          export CXX="${host_clang}"
          export GENTEST_BAZEL_LOCAL_CLANG="${host_clang}"
          bazel test \
            //:gentest_unit_bazel \
            //:gentest_integration_bazel \
            //:gentest_fixtures_bazel \
            //:gentest_skiponly_bazel \
            //:codegen_check_invalid \
            --action_env=CCACHE_DISABLE=1 \
            --host_action_env=CCACHE_DISABLE=1 \
            --action_env=CC \
            --action_env=CXX \
            --host_action_env=CC \
            --host_action_env=CXX \
            --repo_env=GENTEST_BAZEL_LOCAL_CLANG \
            --test_output=errors
          bazel build \
            //:gentest_consumer_textual_bazel \
            --action_env=CCACHE_DISABLE=1 \
            --host_action_env=CCACHE_DISABLE=1 \
            --action_env=CC \
            --action_env=CXX \
            --host_action_env=CC \
            --host_action_env=CXX \
            --repo_env=GENTEST_BAZEL_LOCAL_CLANG
          ./bazel-bin/gentest_consumer_textual_bazel --list
          ./bazel-bin/gentest_consumer_textual_bazel --run=consumer/consumer/module_test --kind=test
          ./bazel-bin/gentest_consumer_textual_bazel --run=consumer/consumer/module_mock --kind=test
          ./bazel-bin/gentest_consumer_textual_bazel --run=consumer/consumer/log_sink --kind=test
          ./bazel-bin/gentest_consumer_textual_bazel --run=consumer/consumer/module_bench --kind=bench
          ./bazel-bin/gentest_consumer_textual_bazel --run=consumer/consumer/module_jitter --kind=jitter
          bazel build \
            //:gentest_consumer_module_bazel \
            --experimental_cpp_modules \
            --action_env=CCACHE_DISABLE=1 \
            --host_action_env=CCACHE_DISABLE=1 \
            --action_env=CC \
            --action_env=CXX \
            --host_action_env=CC \
            --host_action_env=CXX \
            --repo_env=CC \
            --repo_env=CXX \
            --repo_env=GENTEST_BAZEL_LOCAL_CLANG
          ./bazel-bin/gentest_consumer_module_bazel --list
          ./bazel-bin/gentest_consumer_module_bazel --run=consumer/consumer/module_test --kind=test
          ./bazel-bin/gentest_consumer_module_bazel --run=consumer/consumer/module_mock --kind=test
          ./bazel-bin/gentest_consumer_module_bazel --run=consumer/consumer/log_sink --kind=test
          ./bazel-bin/gentest_consumer_module_bazel --run=consumer/consumer/module_bench --kind=bench
          ./bazel-bin/gentest_consumer_module_bazel --run=consumer/consumer/module_jitter --kind=jitter

      - name: Test downstream Bzlmod consumer
        run: |
          set -euxo pipefail
          cmake \
            -DSOURCE_DIR="${GITHUB_WORKSPACE}" \
            -DBUILD_ROOT="${GITHUB_WORKSPACE}/build/buildsystems-linux-bazel-downstream" \
            -P "${GITHUB_WORKSPACE}/tests/cmake/scripts/CheckBazelBzlmodConsumer.cmake"

  meson:
    needs: plan
    if: ${{ needs.plan.outputs.run_meson == 'true' }}
    name: Meson • ${{ matrix.name }}
    runs-on: ubuntu-24.04
    container: ${{ matrix.container }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu 24.04
            container: ubuntu:24.04
            pkg_manager: apt
            clang_version: "20"
            cc: clang-20
            cxx: clang++-20
            llvm_dir: /usr/lib/llvm-20/lib/cmake/llvm
            clang_dir: /usr/lib/llvm-20/lib/cmake/clang
          - name: Fedora 43
            container: fedora:43
            pkg_manager: dnf
            clang_version: "20"
            cc: clang
            cxx: clang++
            llvm_dir: /usr/lib64/cmake/llvm
            clang_dir: /usr/lib64/cmake/clang
    steps:
      - *install_deps_apt
      - *install_deps_dnf
      - *checkout

      - &build_host_codegen
        name: Build host codegen (CMake preset)
        run: |
          set -euxo pipefail
          cmake --preset=host-codegen \
            -DCMAKE_C_COMPILER=${{ matrix.cc }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
            -DLLVM_DIR=${{ matrix.llvm_dir }} \
            -DClang_DIR=${{ matrix.clang_dir }}
          cmake --build --preset=host-codegen --parallel

      - name: Configure/Build/Test
        run: |
          set -euxo pipefail
          host_clang="$(command -v "${{ matrix.cxx }}")"
          meson setup build/meson \
            -Dcodegen_path=build/host-codegen/tools/gentest_codegen \
            -Dcodegen_host_clang="${host_clang}"
          meson compile -C build/meson
          meson test -C build/meson --print-errorlogs

      - name: Test downstream Meson wrap consumer
        run: |
          set -euxo pipefail
          cmake \
            -DSOURCE_DIR="${GITHUB_WORKSPACE}" \
            -DBUILD_ROOT="${GITHUB_WORKSPACE}/build/buildsystems-linux-meson-downstream" \
            -DPROG="${GITHUB_WORKSPACE}/build/host-codegen/tools/gentest_codegen" \
            -P "${GITHUB_WORKSPACE}/tests/cmake/scripts/CheckMesonWrapConsumer.cmake"

  xmake:
    needs: plan
    if: ${{ needs.plan.outputs.run_xmake == 'true' }}
    name: Xmake • ${{ matrix.name }}
    runs-on: ubuntu-24.04
    container: ${{ matrix.container }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu 24.04
            container: ubuntu:24.04
            pkg_manager: apt
            clang_version: "20"
            cc: clang-20
            cxx: clang++-20
            llvm_dir: /usr/lib/llvm-20/lib/cmake/llvm
            clang_dir: /usr/lib/llvm-20/lib/cmake/clang
          - name: Fedora 43
            container: fedora:43
            pkg_manager: dnf
            clang_version: "20"
            cc: clang
            cxx: clang++
            llvm_dir: /usr/lib64/cmake/llvm
            clang_dir: /usr/lib64/cmake/clang
    steps:
      - *install_deps_apt
      - *install_deps_dnf
      - *checkout
      - *build_host_codegen
      - name: Create CI user
        run: |
          set -euxo pipefail
          if ! id -u ci >/dev/null 2>&1; then
            useradd --create-home --shell /bin/bash ci
          fi
          chown -R ci:ci "${GITHUB_WORKSPACE}"

      - name: Install xmake
        run: |
          set -euxo pipefail
          if [ "${{ matrix.pkg_manager }}" = "dnf" ]; then
            xmake_bin="$(command -v xmake)"
            su - ci -c "\"${xmake_bin}\" --version"
          else
            su - ci -c "mkdir -p /home/ci/.local/bin"
            su - ci -c "curl -fsSL -o /home/ci/.local/bin/xmake https://github.com/xmake-io/xmake/releases/download/v${XMAKE_VERSION}/xmake-bundle-v${XMAKE_VERSION}.linux.x86_64"
            su - ci -c "chmod +x /home/ci/.local/bin/xmake"
            su - ci -c "/home/ci/.local/bin/xmake --version"
          fi

      - name: Build
        run: |
          set -euxo pipefail
          codegen_bin="${GITHUB_WORKSPACE}/build/host-codegen/tools/gentest_codegen"
          host_clang="$(command -v "${{ matrix.cxx }}")"
          host_clang_c="$(command -v "${{ matrix.cc }}")"
          if [ "${{ matrix.pkg_manager }}" = "dnf" ]; then
            xmake_bin="$(command -v xmake)"
          else
            xmake_bin="/home/ci/.local/bin/xmake"
          fi
          su - ci -c "cd \"${GITHUB_WORKSPACE}\" && CC=\"${host_clang_c}\" CXX=\"${host_clang}\" GENTEST_CODEGEN=\"${codegen_bin}\" GENTEST_CODEGEN_HOST_CLANG=\"${host_clang}\" \"${xmake_bin}\" f -c -y -m release"
          su - ci -c "cd \"${GITHUB_WORKSPACE}\" && CC=\"${host_clang_c}\" CXX=\"${host_clang}\" GENTEST_CODEGEN=\"${codegen_bin}\" GENTEST_CODEGEN_HOST_CLANG=\"${host_clang}\" \"${xmake_bin}\" build -y"

      - name: Test
        run: |
          set -euxo pipefail
          codegen_bin="${GITHUB_WORKSPACE}/build/host-codegen/tools/gentest_codegen"
          host_clang="$(command -v "${{ matrix.cxx }}")"
          host_clang_c="$(command -v "${{ matrix.cc }}")"
          if [ "${{ matrix.pkg_manager }}" = "dnf" ]; then
            xmake_bin="$(command -v xmake)"
          else
            xmake_bin="/home/ci/.local/bin/xmake"
          fi
          su - ci -c "cd \"${GITHUB_WORKSPACE}\" && CC=\"${host_clang_c}\" CXX=\"${host_clang}\" GENTEST_CODEGEN=\"${codegen_bin}\" GENTEST_CODEGEN_HOST_CLANG=\"${host_clang}\" \"${xmake_bin}\" r -y gentest_unit_xmake"
          su - ci -c "cd \"${GITHUB_WORKSPACE}\" && CC=\"${host_clang_c}\" CXX=\"${host_clang}\" GENTEST_CODEGEN=\"${codegen_bin}\" GENTEST_CODEGEN_HOST_CLANG=\"${host_clang}\" \"${xmake_bin}\" r -y gentest_integration_xmake"
          su - ci -c "cd \"${GITHUB_WORKSPACE}\" && CC=\"${host_clang_c}\" CXX=\"${host_clang}\" GENTEST_CODEGEN=\"${codegen_bin}\" GENTEST_CODEGEN_HOST_CLANG=\"${host_clang}\" \"${xmake_bin}\" r -y gentest_fixtures_xmake"
          su - ci -c "cd \"${GITHUB_WORKSPACE}\" && CC=\"${host_clang_c}\" CXX=\"${host_clang}\" GENTEST_CODEGEN=\"${codegen_bin}\" GENTEST_CODEGEN_HOST_CLANG=\"${host_clang}\" \"${xmake_bin}\" r -y gentest_skiponly_xmake"
          consumer_textual_bin="$(find "${GITHUB_WORKSPACE}" -type f \( -name 'gentest_consumer_textual_xmake' -o -name 'gentest_consumer_textual_xmake.exe' \) | head -n 1)"
          test -n "${consumer_textual_bin}"
          su - ci -c "\"${consumer_textual_bin}\" --list"
          su - ci -c "\"${consumer_textual_bin}\" --run=consumer/consumer/module_test --kind=test"
          su - ci -c "\"${consumer_textual_bin}\" --run=consumer/consumer/module_mock --kind=test"
          su - ci -c "\"${consumer_textual_bin}\" --run=consumer/consumer/log_sink --kind=test"
          su - ci -c "\"${consumer_textual_bin}\" --run=consumer/consumer/module_bench --kind=bench"
          su - ci -c "\"${consumer_textual_bin}\" --run=consumer/consumer/module_jitter --kind=jitter"
          consumer_module_bin="$(find "${GITHUB_WORKSPACE}" -type f \( -name 'gentest_consumer_module_xmake' -o -name 'gentest_consumer_module_xmake.exe' \) | head -n 1)"
          test -n "${consumer_module_bin}"
          su - ci -c "\"${consumer_module_bin}\" --list"
          su - ci -c "\"${consumer_module_bin}\" --run=consumer/consumer/module_test --kind=test"
          su - ci -c "\"${consumer_module_bin}\" --run=consumer/consumer/module_mock --kind=test"
          su - ci -c "\"${consumer_module_bin}\" --run=consumer/consumer/log_sink --kind=test"
          su - ci -c "\"${consumer_module_bin}\" --run=consumer/consumer/module_bench --kind=bench"
          su - ci -c "\"${consumer_module_bin}\" --run=consumer/consumer/module_jitter --kind=jitter"

      - name: Test downstream Xmake xrepo consumer
        run: |
          set -euxo pipefail
          if [ "${{ matrix.pkg_manager }}" = "dnf" ]; then
            xmake_path="$(command -v xmake)"
          else
            xmake_path="/home/ci/.local/bin/xmake"
          fi
          su - ci -c "PATH=\"$(dirname "${xmake_path}"):\${PATH}\" cmake \
            -DSOURCE_DIR=\"${GITHUB_WORKSPACE}\" \
            -DBUILD_ROOT=\"${GITHUB_WORKSPACE}/build/buildsystems-linux-xmake-downstream\" \
            -DPROG=\"${GITHUB_WORKSPACE}/build/host-codegen/tools/gentest_codegen\" \
            -P \"${GITHUB_WORKSPACE}/tests/cmake/scripts/CheckXmakeXrepoConsumer.cmake\""
