name: runtime-recording
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      candidate_sha:
        description: Exact candidate commit to test
        required: true
        type: string
      base_sha:
        description: Frozen comparison base
        type: string
        default: ''
      pr_number:
        description: Validated PR number for concurrency isolation
        type: string
        default: ''

permissions:
  contents: read
concurrency:
  group: runtime-recording-${{ inputs.pr_number && format('pr-{0}', inputs.pr_number) || github.ref }}
  cancel-in-progress: true
jobs:
  adapters:
    runs-on: ubuntu-24.04
    container: fedora:43
    defaults:
      run:
        shell: bash
    steps:
      - name: Install toolchain
        run: |
          dnf -y install git tar unzip zip curl ninja-build python3 python3-pip make \
            gcc-c++ fmt-devel boost-devel autoconf automake libtool pkgconf-pkg-config \
            zlib-ng-compat-devel libxml2-devel libzstd-devel libffi-devel libunwind-devel
          python3 -m pip install --upgrade cmake ninja
          python3 - <<'PY' >> "$GITHUB_PATH"
          import sysconfig
          print(sysconfig.get_path("scripts"))
          PY
      - name: Checkout trusted provisioning
        uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Setup LLVM toolchain
        uses: ./.github/actions/setup-llvm
      - name: Checkout candidate
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
          persist-credentials: false

      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          repository: microsoft/vcpkg
          ref: cc73782a88db48af17f8bfb8328d4cab3d4c246f
          path: .deps/vcpkg
      - name: Install real pinned serializers
        run: |
          .deps/vcpkg/bootstrap-vcpkg.sh -disableMetrics
          .deps/vcpkg/vcpkg install --x-feature=record-glaze --x-feature=record-cbor \
            --x-install-root=build/recording-vcpkg
      - name: Exercise recording and installed serializers
        run: |
          python3 scripts/validation_suites.py recording --work build/recording \
            --serializers "$PWD/build/recording-vcpkg/x64-linux" --cc "${CC}" --cxx "${CXX}"
      - name: Upload recording evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-recording
          path: |
            build/recording/build/tests/recording-reports
            build/recording/build/tests/recording_adapters/*-reports
            build/recording/example/reports
