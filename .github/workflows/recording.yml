name: runtime-recording
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  adapters:
    runs-on: ubuntu-24.04
    container: fedora:43
    defaults:
      run:
        shell: bash
    steps:
      - name: Install toolchain
        run: |
          dnf -y install git tar unzip zip curl ninja-build python3 python3-pip make \
            clang clang-devel llvm-devel gcc-c++ fmt-devel boost-devel autoconf automake libtool pkgconf-pkg-config \
            zlib-ng-compat-devel libxml2-devel libzstd-devel libffi-devel libunwind-devel
          python3 -m pip install --upgrade cmake ninja
          python3 - <<'PY' >> "$GITHUB_PATH"
          import sysconfig
          print(sysconfig.get_path("scripts"))
          PY
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: microsoft/vcpkg
          ref: cc73782a88db48af17f8bfb8328d4cab3d4c246f
          path: .deps/vcpkg
      - name: Install real pinned serializers
        run: |
          .deps/vcpkg/bootstrap-vcpkg.sh -disableMetrics
          .deps/vcpkg/vcpkg install --x-feature=record-glaze --x-feature=record-cbor \
            --x-install-root=build/recording-vcpkg
      - name: Build and test recording
        run: |
          cmake --preset=debug-system -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DLLVM_DIR=/usr/lib64/cmake/llvm -DClang_DIR=/usr/lib64/cmake/clang \
            -DCMAKE_PREFIX_PATH="$PWD/build/recording-vcpkg/x64-linux" \
            -DGENTEST_ENABLE_RECORDING_ADAPTER_TESTS=ON -DGENTEST_ENABLE_PACKAGE_TESTS=OFF \
            -DGENTEST_USE_BOOST_JSON=ON -Dgentest_INSTALL=ON \
            -DCMAKE_INSTALL_PREFIX="$PWD/build/recording-install"
          cmake --build --preset=debug-system --parallel 2 --target \
            gentest_recording_tests gentest_record_json_tests gentest_record_cbor_tests gentest_record_json_noexceptions gentest_main
          ctest --preset=debug-system --output-on-failure -R '^runtime_record'
      - name: Exercise installed example with both serializers
        run: |
          cmake --install build/debug-system
          cmake -S examples/recording -B build/recording-example -G Ninja \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_PREFIX_PATH="$PWD/build/recording-install;$PWD/build/recording-vcpkg/x64-linux" \
            -DRECORDING_WITH_GLAZE=ON -DRECORDING_WITH_CBOR=ON
          cmake --build build/recording-example --parallel 2
          ctest --test-dir build/recording-example --output-on-failure
          python3 tests/scripts/check_example_reports.py \
            build/recording-example/gentest_recording recording build/recording-example/reports
      - name: Upload recording evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-recording
          path: |
            build/debug-system/tests/recording-reports
            build/debug-system/tests/recording_adapters/*-reports
            build/recording-example/reports
