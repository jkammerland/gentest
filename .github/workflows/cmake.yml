name: cmake

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Test profile (pr runs five smoke environments; full runs exhaustive validation)
        type: choice
        options: [full, pr]
        default: pr
  workflow_call:
    inputs:
      profile:
        type: string
        default: pr

permissions:
  contents: read

concurrency:
  group: cmake-${{ github.ref }}
  cancel-in-progress: true

env:
  GENTEST_CI_PROFILE: ${{ inputs.profile || 'pr' }}
  CTEST_OUTPUT_ON_FAILURE: 1
  GENTEST_HELPER_BUILD_PARALLEL_LEVEL: 1

jobs:
  plan:
    name: CMake • plan
    runs-on: ubuntu-24.04
    outputs:
      linux: ${{ steps.matrix.outputs.linux }}
      windows: ${{ steps.matrix.outputs.windows }}
      macos: ${{ steps.matrix.outputs.macos }}
    steps:
      - name: Checkout matrix definition
        uses: actions/checkout@v6
      - name: Select validation matrix
        id: matrix
        run: python3 scripts/ci_matrix.py --profile "${GENTEST_CI_PROFILE}" --github-output "$GITHUB_OUTPUT"

  macos:
    needs: plan
    name: macOS • ${{ matrix.compiler == 'appleclang' && 'AppleClang (Xcode 26)' || format('Homebrew {0}', matrix.compiler) }} • ${{ matrix.variant == 'cxx23' && 'C++23 tests' || matrix.build-type }}
    runs-on: ${{ matrix.compiler == 'appleclang' && 'macos-26' || 'macos-15' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.macos) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Cache vcpkg binary artifacts
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/vcpkg
            ~/Library/Caches/vcpkg
          key: vcpkg-${{ runner.os }}-${{ matrix.compiler }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'scripts/setup-vcpkg.sh') }}

      - name: Select Xcode 26 toolchain
        if: matrix.compiler == 'appleclang'
        run: |
          xcode_path="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort | tail -n 1 || true)"
          if [ -n "${xcode_path}" ]; then
            sudo xcode-select --switch "${xcode_path}/Contents/Developer"
          else
            sudo xcode-select --switch /Applications/Xcode.app/Contents/Developer
          fi
          xcodebuild -version

      - name: Install dependencies (Homebrew)
        run: |
          brew update
          if [ "${{ matrix.compiler }}" = "llvm@20" ]; then
            brew install llvm@20 ninja ccache googletest doctest
          elif [ "${{ matrix.compiler }}" = "llvm@21" ] || [ "${{ matrix.compiler }}" = "llvm@23" ]; then
            brew install "${{ matrix.compiler }}" ninja ccache googletest doctest
          else
            brew install llvm ninja ccache googletest doctest
          fi
          if [ "${{ matrix.compiler }}" = "llvm@21" ] && [ "${{ matrix.build-type }}" = "debug" ] && [ "${{ matrix.variant }}" = "default" ]; then
            brew install bazelisk
          fi
          echo "$(brew --prefix ninja)/bin" >> $GITHUB_PATH
          if [ "${{ matrix.compiler }}" = "llvm@21" ] && [ "${{ matrix.build-type }}" = "debug" ] && [ "${{ matrix.variant }}" = "default" ]; then
            echo "$(brew --prefix)/bin" >> $GITHUB_PATH
          fi

      - name: Configure LLVM environment
        run: |
          if [ "${{ matrix.compiler }}" = "llvm@20" ]; then
            LLVM_PREFIX="$(brew --prefix llvm@20)"
          elif [ "${{ matrix.compiler }}" = "llvm@21" ] || [ "${{ matrix.compiler }}" = "llvm@23" ]; then
            LLVM_PREFIX="$(brew --prefix "${{ matrix.compiler }}")"
          else
            LLVM_PREFIX="$(brew --prefix llvm)"
          fi
          echo "LLVM_DIR=${LLVM_PREFIX}/lib/cmake/llvm" >> $GITHUB_ENV
          echo "Clang_DIR=${LLVM_PREFIX}/lib/cmake/clang" >> $GITHUB_ENV
          echo "PATH=${LLVM_PREFIX}/bin:$PATH" >> $GITHUB_ENV
          if [ "${{ matrix.compiler }}" = "llvm" ] || [ "${{ matrix.compiler }}" = "llvm@23" ] || [ "${{ matrix.compiler }}" = "llvm@21" ] || [ "${{ matrix.compiler }}" = "llvm@20" ]; then
            echo "LLVM_BIN=${LLVM_PREFIX}/bin" >> $GITHUB_ENV
          fi

      - name: Configure environment
        run: |
          echo "SDKROOT=$(xcrun --show-sdk-path)" >> $GITHUB_ENV
          echo "CCACHE_DISABLE=1" >> $GITHUB_ENV
          echo "CMAKE_GENERATOR=Ninja" >> $GITHUB_ENV

      - name: Show tool versions
        run: |
          cmake --version
          command -v ninja
          ninja --version
          COMPILER_BIN="${LLVM_BIN:-/usr/bin}"
          "${COMPILER_BIN}/clang" --version
          brew list --versions llvm llvm@20 llvm@21 llvm@23 || true
          if [ "${{ matrix.compiler }}" = "llvm@23" ]; then
            test "$("${COMPILER_BIN}/clang" --version | sed -nE 's/.*clang version ([0-9]+).*/\1/p' | head -n 1)" = "23"
          fi

      - name: Setup vcpkg
        run: bash scripts/setup-vcpkg.sh

      - name: Configure
        run: |
          COMPILER_BIN="${LLVM_BIN:-/usr/bin}"
          CMAKE_ARGS=(
            "--preset=${{ matrix.build-type }}"
            "-DCMAKE_C_COMPILER=${COMPILER_BIN}/clang"
            "-DCMAKE_CXX_COMPILER=${COMPILER_BIN}/clang++"
            "-DCMAKE_MAKE_PROGRAM=$(command -v ninja)"
            "-DVCPKG_CHAINLOAD_TOOLCHAIN_FILE="
          )
          if [ -n "${LLVM_DIR:-}" ]; then
            CMAKE_ARGS+=("-DLLVM_DIR=${LLVM_DIR}")
            # Also add Clang_DIR to find ClangConfig.cmake
            CLANG_DIR="$(dirname ${LLVM_DIR})/clang"
            if [ -f "${CLANG_DIR}/ClangConfig.cmake" ]; then
              CMAKE_ARGS+=("-DClang_DIR=${CLANG_DIR}")
            fi
          fi
          if [ -n "${LLVM_BIN:-}" ] && [ -x "${LLVM_BIN}/clang-scan-deps" ]; then
            CMAKE_ARGS+=("-DCMAKE_CXX_COMPILER_CLANG_SCAN_DEPS=${LLVM_BIN}/clang-scan-deps")
          fi
          if [ -n "${{ matrix.test_cxx_standard }}" ]; then
            CMAKE_ARGS+=("-DGENTEST_TEST_CXX_STANDARD=${{ matrix.test_cxx_standard }}")
          fi
          if [ -n "${{ matrix.enable_package_tests }}" ]; then
            CMAKE_ARGS+=("-DGENTEST_ENABLE_PACKAGE_TESTS=${{ matrix.enable_package_tests }}")
          fi
          CMAKE_ARGS+=("-DGENTEST_REQUIRE_THIRD_PARTY_MOCK_CONSUMERS=ON")
          CMAKE_ARGS+=("-DCMAKE_PREFIX_PATH=$(brew --prefix googletest);$(brew --prefix doctest)")
          cmake "${CMAKE_ARGS[@]}"

      - name: Build
        run: cmake --build --preset=${{ matrix.build-type }}

      - name: Test Bazel Bzlmod Consumer
        if: matrix.compiler == 'llvm@21' && matrix.build-type == 'debug' && matrix.variant == 'default'
        run: ctest --preset=${{ matrix.build-type }} --output-on-failure -R '^(gentest_bazel_bzlmod_consumer)$'

      - name: Test
        run: |
          ctest_args=(--no-tests=error --preset=${{ matrix.build-type }} --output-on-failure --parallel 4 -E '^(gentest_bazel_bzlmod_consumer)$')
          if [ "${GENTEST_CI_PROFILE}" = "pr" ]; then
            ctest_args+=(--label-regex '^ci-smoke$')
          fi
          ctest "${ctest_args[@]}"

  windows:
    needs: plan
    name: Windows • LLVM ${{ matrix.llvm-version }} • ${{ matrix.variant == 'cxx23' && 'C++23 tests' || matrix.preset }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.windows) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install modern Ninja
        shell: pwsh
        run: |
          py -m pip install --user --upgrade ninja
          $scripts = py -c "import sysconfig; print(sysconfig.get_path('scripts'))"
          $scripts | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Cache extracted LLVM toolchain
        id: cache-llvm
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}\llvm\clang+llvm-${{ matrix.llvm-version }}-x86_64-pc-windows-msvc
          key: llvm-${{ runner.os }}-${{ matrix.llvm-version }}

      - name: Download LLVM distribution (tarball)
        if: steps.cache-llvm.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $version = "${{ matrix.llvm-version }}"
          $archive = "clang+llvm-$version-x86_64-pc-windows-msvc.tar.xz"
          $url = "https://github.com/llvm/llvm-project/releases/download/llvmorg-$version/$archive"
          Invoke-WebRequest -Uri $url -OutFile $archive

      - name: Extract LLVM toolchain
        if: steps.cache-llvm.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $version = "${{ matrix.llvm-version }}"
          $root = Join-Path $env:RUNNER_TEMP "llvm"
          $null = New-Item -ItemType Directory -Force -Path $root
          $archive = Get-Item "clang+llvm-$version-x86_64-pc-windows-msvc.tar.xz"

          # bsdtar extraction on windows runners is extremely slow; use 7-Zip instead.
          $sevenZip = Join-Path $env:ProgramFiles "7-Zip\\7z.exe"
          if (-not (Test-Path $sevenZip)) { $sevenZip = "7z.exe" }

          & $sevenZip x -y $archive.FullName "-o$root"
          $tarPath = Join-Path $root "clang+llvm-$version-x86_64-pc-windows-msvc.tar"
          if (-not (Test-Path $tarPath)) { throw "7-Zip failed to produce tar archive at $tarPath" }
          & $sevenZip x -y $tarPath "-o$root"

          Remove-Item -Force -ErrorAction SilentlyContinue $tarPath
          Remove-Item -Force -ErrorAction SilentlyContinue $archive.FullName

      - name: Configure LLVM environment
        shell: pwsh
        run: |
          $version = "${{ matrix.llvm-version }}"
          $root = Join-Path $env:RUNNER_TEMP "llvm"
          $extracted = Join-Path $root "clang+llvm-$version-x86_64-pc-windows-msvc"
          if (-not (Test-Path $extracted)) { throw "Failed to locate extracted LLVM directory at $extracted" }
          "$extracted\\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "LLVM_BIN=$extracted\\bin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "LLVM_DIR=$extracted\\lib\\cmake\\llvm" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "Clang_DIR=$extracted\\lib\\cmake\\clang" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup LLVM 23 package dependencies
        if: matrix.llvm-version == '23.1.0'
        shell: bash
        env:
          VCPKG_ROOT: ${{ runner.temp }}/gentest-vcpkg
        run: bash scripts/setup-vcpkg.sh

      - name: Install LLVM 23 package dependencies
        if: matrix.llvm-version == '23.1.0'
        shell: pwsh
        run: |
          Push-Location $env:RUNNER_TEMP
          $packages = @(
            "zlib:x64-windows",
            "zstd:x64-windows",
            "libxml2:x64-windows"
          )
          & (Join-Path $env:VCPKG_ROOT "vcpkg.exe") install @packages
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
          $prefix = Join-Path $env:VCPKG_ROOT "installed\\x64-windows"
          "LLVM_DEPENDENCY_PREFIX=$prefix" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CMAKE_PREFIX_PATH=$prefix" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          (Join-Path $prefix "bin") | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Show tool versions
        shell: pwsh
        run: |
          cmake --version
          (Get-Command ninja).Source
          ninja --version
          & (Join-Path $env:LLVM_BIN "clang.exe") --version
          & (Join-Path $env:LLVM_BIN "clang++.exe") --version

      - name: Configure
        shell: pwsh
        run: |
          $cmakeArgs = @(
            "--preset=${{ matrix.preset }}",
            "-DCMAKE_C_COMPILER=$env:LLVM_BIN\\clang.exe",
            "-DCMAKE_CXX_COMPILER=$env:LLVM_BIN\\clang++.exe",
            "-DCMAKE_MAKE_PROGRAM=$((Get-Command ninja).Source)",
            "-DLLVM_DIR=$env:LLVM_DIR",
            "-DClang_DIR=$env:Clang_DIR",
            "-DGENTEST_ENABLE_PACKAGE_TESTS=${{ matrix.enable_package_tests || 'OFF' }}"
          )
          if ($env:LLVM_DEPENDENCY_PREFIX) {
            $cmakeArgs += "-DCMAKE_PREFIX_PATH=$env:LLVM_DEPENDENCY_PREFIX"
          }
          if ("${{ matrix.preset }}" -in @("debug-system", "debug-system-cxx23")) {
            $cmakeArgs += "-DGENTEST_SKIP_WINDOWS_DEBUG_DEATH_TESTS=ON"
          }
          cmake @cmakeArgs

      - name: Build
        shell: pwsh
        run: cmake --build --preset=${{ matrix.preset }}

      - name: Test Bazel helper contract
        shell: pwsh
        run: ctest --preset=${{ matrix.preset }} --output-on-failure -R '^(gentest_bazel_helpers_use_configured_toolchain)$'

      - name: Test
        shell: pwsh
        run: |
          $ctestArgs = @("--no-tests=error", "--preset=${{ matrix.preset }}", "--output-on-failure", "--parallel", "4", "-E", "^(gentest_bazel_helpers_use_configured_toolchain)$")
          if ($env:GENTEST_CI_PROFILE -eq "pr") {
            $ctestArgs += @("--label-regex", "^ci-smoke$")
          }
          ctest @ctestArgs

      - name: Configure/Build/Test (MSVC)
        if: matrix.preset == 'debug-system'
        shell: pwsh
        run: |
          # Also validate MSVC + LLVM tooling (Debug only).
          $msvcBuildDir = Join-Path $env:GITHUB_WORKSPACE "build\\debug-system-msvc"
          cmake -S . -B $msvcBuildDir -G Ninja `
            -DCMAKE_BUILD_TYPE=Debug `
            -DCMAKE_C_COMPILER=cl `
            -DCMAKE_CXX_COMPILER=cl `
            -Dgentest_BUILD_TESTING=ON `
            -DGENTEST_ENABLE_PACKAGE_TESTS=${{ matrix.enable_package_tests || 'OFF' }} `
            -DGENTEST_SKIP_WINDOWS_DEBUG_DEATH_TESTS=ON `
            -DLLVM_DIR="$env:LLVM_DIR" `
            -DClang_DIR="$env:Clang_DIR"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build $msvcBuildDir
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $ctestArgs = @("--no-tests=error", "--test-dir", $msvcBuildDir, "--output-on-failure", "--parallel", "4")
          if ($env:GENTEST_CI_PROFILE -eq "pr") {
            $ctestArgs += @("--label-regex", "^ci-smoke$")
          }
          ctest @ctestArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  linux:
    needs: plan
    name: ${{ matrix.name }} • ${{ matrix.preset == 'debug-system-cxx23' && 'C++23 tests' || matrix.build_type }}
    runs-on: ubuntu-24.04
    container: ${{ matrix.container }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.linux) }}
    steps:
      - name: Update and install dependencies (apt)
        if: ${{ matrix.pkg_manager == 'apt' }}
        run: |
          set -euxo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt_common_opts=(-o Acquire::Retries=5 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
          apt_update_opts=("${apt_common_opts[@]}" -o APT::Update::Error-Mode=any)
          apt_update() {
            for attempt in 1 2 3 4 5; do
              apt-get "${apt_update_opts[@]}" update && return 0
              apt-get clean
              rm -rf /var/lib/apt/lists/*
              sleep $((attempt * 10))
            done
            apt-get "${apt_update_opts[@]}" update
          }
          apt_install() {
            for attempt in 1 2 3 4 5; do
              apt-get "${apt_common_opts[@]}" install -y --no-install-recommends "$@" && return 0
              apt-get clean
              rm -rf /var/lib/apt/lists/*
              sleep $((attempt * 10))
              apt_update
            done
            apt-get "${apt_common_opts[@]}" install -y --no-install-recommends "$@"
          }
          apt_update
          apt_install \
            git \
            build-essential \
            ccache \
            ninja-build \
            python3 \
            python3-pip \
            pkg-config \
            curl \
            zip \
            unzip \
            tar \
            ca-certificates \
            gnupg \
            libffi-dev \
            libxml2-dev \
            zlib1g-dev \
            libzstd-dev \
            libcurl4-openssl-dev \
            libunwind-dev \
            libfmt-dev \
            libgtest-dev \
            libgmock-dev \
            libtrompeloeil-cpp-dev \
            doctest-dev
          if [ "${{ matrix.setup_mode }}" = "apt-llvm-org" ]; then
            curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key | tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc >/dev/null
            printf '%s\n' \
              'Types: deb' \
              'URIs: https://apt.llvm.org/noble/' \
              'Suites: llvm-toolchain-noble-${{ matrix.clang_version }}' \
              'Components: main' \
              'Signed-By: /etc/apt/trusted.gpg.d/apt.llvm.org.asc' \
              >/etc/apt/sources.list.d/apt-llvm-${{ matrix.clang_version }}.sources
            apt_update
          fi
          apt_install \
            clang-${{ matrix.clang_version }} \
            clang-tools-${{ matrix.clang_version }} \
            libclang-${{ matrix.clang_version }}-dev \
            libclang-rt-${{ matrix.clang_version }}-dev \
            libclang-cpp${{ matrix.clang_version }}-dev \
            llvm-${{ matrix.clang_version }}-dev
          python3 -m pip install --break-system-packages --upgrade cmake ninja
          python3 - <<'PY' >> "$GITHUB_PATH"
          import sysconfig
          print(sysconfig.get_path("scripts"))
          PY
          echo "/usr/lib/llvm-${{ matrix.clang_version }}/bin" >> "$GITHUB_PATH"
      - name: Update and install dependencies (dnf)
        if: ${{ matrix.pkg_manager == 'dnf' }}
        run: |
          set -euxo pipefail
          dnf -y upgrade --refresh
          if [ "${{ matrix.setup_mode }}" = "upstream-archive" ]; then
            dnf -y install \
              git \
              which \
              tar \
              xz \
              ccache \
              ninja-build \
              python3 \
              python3-pip \
              pkg-config \
              curl \
              zip \
              unzip \
              fmt-devel \
              zlib-ng-compat-devel \
              libzstd-devel \
              libunwind-devel \
              libcurl-devel \
              libffi-devel \
              libxml2-devel \
              gtest-devel \
              gmock-devel \
              doctest-devel \
              gcc \
              gcc-c++ \
              make \
              ca-certificates
            curl -L --fail -o /tmp/LLVM-${{ matrix.llvm_release }}-Linux-X64.tar.xz \
              https://github.com/llvm/llvm-project/releases/download/llvmorg-${{ matrix.llvm_release }}/LLVM-${{ matrix.llvm_release }}-Linux-X64.tar.xz
            mkdir -p /opt/llvm-${{ matrix.llvm_release }}
            tar -xf /tmp/LLVM-${{ matrix.llvm_release }}-Linux-X64.tar.xz -C /opt/llvm-${{ matrix.llvm_release }} --strip-components=1
            echo "/opt/llvm-${{ matrix.llvm_release }}/bin" >> "$GITHUB_PATH"
          else
            dnf -y install \
              git \
              which \
              tar \
              xz \
              ccache \
              ninja-build \
              python3 \
              python3-pip \
              pkg-config \
              curl \
              zip \
              unzip \
              clang \
              clang-libs \
              clang-devel \
              clang-tools-extra \
              llvm-devel \
              fmt-devel \
              zlib-ng-compat-devel \
              libzstd-devel \
              libunwind-devel \
              libcurl-devel \
              libffi-devel \
              libxml2-devel \
              gtest-devel \
              gmock-devel \
              doctest-devel \
              gcc \
              gcc-c++ \
              make \
              ca-certificates
          fi
          python3 -m pip install --upgrade pip cmake ninja
          python3 - <<'PY' >> "$GITHUB_PATH"
          import sysconfig
          print(sysconfig.get_path("scripts"))
          PY
      - name: Update and install dependencies (apk)
        if: ${{ matrix.pkg_manager == 'apk' }}
        shell: sh
        run: |
          set -eux
          apk update
          # Alpine splits files referenced by LLVM/Clang's CMake exports across
          # the base, -static, -gtest, and -extra-tools packages.
          apk add --no-cache \
            bash \
            build-base \
            ca-certificates \
            ccache \
            clang${{ matrix.llvm_version }} \
            clang${{ matrix.llvm_version }}-dev \
            clang${{ matrix.llvm_version }}-extra-tools \
            clang${{ matrix.llvm_version }}-static \
            cmake \
            curl \
            fmt-dev \
            git \
            libffi-dev \
            libxml2-dev \
            linux-headers \
            llvm${{ matrix.llvm_version }} \
            llvm${{ matrix.llvm_version }}-dev \
            llvm${{ matrix.llvm_version }}-gtest \
            llvm${{ matrix.llvm_version }}-static \
            ninja \
            py3-pip \
            pkgconf \
            python3 \
            tar \
            unzip \
            xz \
            zip \
            zlib-dev \
            zstd-dev
          python3 -m pip install --break-system-packages --upgrade ninja || python3 -m pip install --upgrade ninja
          python3 - <<'PY' >> "$GITHUB_PATH"
          import sysconfig
          print(sysconfig.get_path("scripts"))
          PY
          echo "/usr/lib/llvm${{ matrix.llvm_version }}/bin" >> "$GITHUB_PATH"
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure environment variables
        run: |
          echo "LLVM_DIR=${{ matrix.llvm_dir }}" >> $GITHUB_ENV
          echo "Clang_DIR=${{ matrix.clang_dir }}" >> $GITHUB_ENV
          echo "CC=${{ matrix.cc }}" >> $GITHUB_ENV
          echo "CXX=${{ matrix.cxx }}" >> $GITHUB_ENV
          echo "GENTEST_XMAKE_TEST_TARGET_CC=${{ matrix.cc }}" >> $GITHUB_ENV
          echo "GENTEST_XMAKE_TEST_TARGET_CXX=${{ matrix.cxx }}" >> $GITHUB_ENV
          host_clang_root="$(dirname "$(dirname "$(dirname "${{ matrix.clang_dir }}")")")"
          host_clang=""
          for candidate in \
            "${host_clang_root}/bin/clang++" \
            "${host_clang_root}/bin/clang++-${{ matrix.clang_version }}" \
            "${host_clang_root}/bin/clang++-${{ matrix.llvm_version }}" \
            "clang++-${{ matrix.clang_version }}" \
            "clang++-${{ matrix.llvm_version }}" \
            "clang++"
          do
            if [ -n "${candidate}" ] && [ -x "${candidate}" ]; then
              host_clang="${candidate}"
              break
            fi
            if [ -n "${candidate}" ] && command -v "${candidate}" >/dev/null 2>&1; then
              host_clang="$(command -v "${candidate}")"
              break
            fi
          done
          if [ -z "${host_clang}" ]; then
            echo "Failed to resolve host clang++ for gentest_codegen." >&2
            exit 1
          fi
          echo "GENTEST_CODEGEN_HOST_CLANG=${host_clang}" >> $GITHUB_ENV
          echo "GENTEST_CODEGEN_JOBS=${{ matrix.codegen_jobs }}" >> $GITHUB_ENV
          echo "GENTEST_CMAKE_PRESET=${{ matrix.preset || (matrix.build_type == 'debug' && 'debug-system' || 'release-system') }}" >> $GITHUB_ENV
          echo "CMAKE_GENERATOR=Ninja" >> $GITHUB_ENV
          echo "PATH=/usr/local/bin:$PATH" >> $GITHUB_ENV
      - name: Show tool versions
        run: |
          set -euxo pipefail
          cmake --version
          command -v ninja
          ninja --version
          ${CC} --version
          clang --version || true
          if command -v llvm-config >/dev/null 2>&1; then llvm-config --version; fi
      - name: Configure
        env:
          LC_ALL: C.UTF-8
          LANG: C.UTF-8
        run: |
          set -euxo pipefail
          CMAKE_ARGS=(
            "--preset=${GENTEST_CMAKE_PRESET}"
            "-DCMAKE_C_COMPILER=${CC}"
            "-DCMAKE_CXX_COMPILER=${CXX}"
            "-DCMAKE_MAKE_PROGRAM=$(command -v ninja)"
            "-DLLVM_DIR=${LLVM_DIR}"
            "-DClang_DIR=${Clang_DIR}"
            "-DGENTEST_CODEGEN_HOST_CLANG=${GENTEST_CODEGEN_HOST_CLANG}"
            "-DGENTEST_ENABLE_PACKAGE_TESTS=${{ matrix.enable_package_tests || 'OFF' }}"
          )
          if [ "${{ matrix.compiler }}" = "clang" ]; then
            scan_deps=""
            for candidate in \
              "${CXX/clang++/clang-scan-deps}" \
              "clang-scan-deps-${{ matrix.clang_version }}" \
              "clang-scan-deps-${{ matrix.llvm_version }}" \
              "clang-scan-deps"
            do
              if [ -n "$candidate" ] && command -v "$candidate" >/dev/null 2>&1; then
                scan_deps="$(command -v "$candidate")"
                break
              fi
            done
            if [ -n "$scan_deps" ]; then
              CMAKE_ARGS+=("-DCMAKE_CXX_COMPILER_CLANG_SCAN_DEPS=${scan_deps}")
            fi
          fi
          if [ "${{ matrix.pkg_manager }}" != "apk" ]; then
            CMAKE_ARGS+=("-DGENTEST_REQUIRE_THIRD_PARTY_MOCK_CONSUMERS=ON")
          fi
          if [ "${{ matrix.pkg_manager }}" = "apt" ]; then
            CMAKE_ARGS+=("-DGENTEST_REQUIRE_TROMPELOEIL_MOCK_CONSUMER=ON")
          fi
          cmake "${CMAKE_ARGS[@]}"
      - name: Build
        run: |
          set -euxo pipefail
          cmake --build --preset=${GENTEST_CMAKE_PRESET} --parallel
      - name: Test
        env:
          LC_ALL: C.UTF-8
          LANG: C.UTF-8
        run: |
          set -euxo pipefail
          ctest_args=(--no-tests=error --preset=${GENTEST_CMAKE_PRESET} --output-on-failure --parallel ${{ matrix.ctest_parallel || 4 }})
          if [ "${GENTEST_CI_PROFILE}" = "pr" ]; then
            ctest_args+=(--label-regex '^ci-smoke$')
          fi
          ctest "${ctest_args[@]}"

  package-workflow:
    needs: plan
    if: ${{ inputs.profile == 'full' }}
    name: Package Workflow
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Cache vcpkg binary artifacts
        uses: actions/cache@v5
        with:
          path: ~/.cache/vcpkg
          key: vcpkg-${{ runner.os }}-package-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'scripts/setup-vcpkg.sh') }}

      - name: Install dependencies
        run: |
          set -euxo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt_common_opts=(-o Acquire::Retries=5 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
          apt_update_opts=("${apt_common_opts[@]}" -o APT::Update::Error-Mode=any)
          apt_update() {
            for attempt in 1 2 3 4 5; do
              sudo apt-get "${apt_update_opts[@]}" update && return 0
              sudo apt-get clean
              sudo rm -rf /var/lib/apt/lists/*
              sleep $((attempt * 10))
            done
            sudo apt-get "${apt_update_opts[@]}" update
          }
          apt_install() {
            for attempt in 1 2 3 4 5; do
              sudo apt-get "${apt_common_opts[@]}" install -y --no-install-recommends "$@" && return 0
              sudo apt-get clean
              sudo rm -rf /var/lib/apt/lists/*
              sleep $((attempt * 10))
              apt_update
            done
            sudo apt-get "${apt_common_opts[@]}" install -y --no-install-recommends "$@"
          }
          apt_update
          apt_install \
            git \
            build-essential \
            ninja-build \
            python3 \
            python3-pip \
            pkg-config \
            curl \
            zip \
            unzip \
            tar \
            ca-certificates \
            gnupg \
            libffi-dev \
            libxml2-dev \
            zlib1g-dev \
            libzstd-dev \
            libcurl4-openssl-dev \
            libunwind-dev \
            libfmt-dev
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc >/dev/null
          printf '%s\n' \
            'Types: deb' \
            'URIs: https://apt.llvm.org/noble/' \
            'Suites: llvm-toolchain-noble-20' \
            'Components: main' \
            'Signed-By: /etc/apt/trusted.gpg.d/apt.llvm.org.asc' \
            | sudo tee /etc/apt/sources.list.d/apt-llvm-20.sources >/dev/null
          apt_update
          apt_install \
            clang-20 \
            clang-tools-20 \
            libclang-20-dev \
            libclang-cpp20-dev \
            llvm-20-dev
          # The release-package preset pins CMake 4.3 experimental CPS/SBOM
          # activation UUIDs, so keep this lane on the matching CMake release.
          python3 -m pip install --break-system-packages cmake==4.3.4 ninja
          python3 - <<'PY' >> "$GITHUB_PATH"
          import sysconfig
          print(sysconfig.get_path("scripts"))
          PY
          echo "/usr/lib/llvm-20/bin" >> "$GITHUB_PATH"
          echo "LLVM_DIR=/usr/lib/llvm-20/lib/cmake/llvm" >> "$GITHUB_ENV"
          echo "Clang_DIR=/usr/lib/llvm-20/lib/cmake/clang" >> "$GITHUB_ENV"
          echo "CC=clang-20" >> "$GITHUB_ENV"
          echo "CXX=clang++-20" >> "$GITHUB_ENV"

      - name: Setup vcpkg
        run: bash scripts/setup-vcpkg.sh

      - name: Restore pinned packaging CMake
        run: |
          set -euxo pipefail
          packaging_cmake_bin="$(python3 -c 'import cmake; print(cmake.CMAKE_BIN_DIR)')"
          test -x "${packaging_cmake_bin}/cmake"
          "${packaging_cmake_bin}/cmake" --version | grep -F 'cmake version 4.3.4'
          echo "${packaging_cmake_bin}" >> "$GITHUB_PATH"

      - name: Show tool versions
        run: |
          set -euxo pipefail
          cmake --version
          ninja --version
          clang-20 --version
          clang++-20 --version

      - name: Run package workflow
        run: |
          set -euxo pipefail
          cmake --workflow --preset=package
