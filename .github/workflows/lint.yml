name: lint

on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Lint • plan
    runs-on: ubuntu-24.04
    outputs:
      run_lint: ${{ steps.plan.outputs.run_lint }}
    steps:
      - name: Checkout planner and history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Compute CI plan
        id: plan
        env:
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_REF: ${{ github.ref }}
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          ci_plan_script="scripts/ci_plan.py"
          if [ "${CI_EVENT_NAME}" = "pull_request" ]; then
            ci_plan_script="${RUNNER_TEMP}/ci_plan.py"
            if ! git show "${CI_BASE_SHA}:scripts/ci_plan.py" > "${ci_plan_script}"; then
              ci_plan_script=""
            fi
          fi
          if [ -z "${ci_plan_script}" ] || ! python3 "${ci_plan_script}" \
            --event "${CI_EVENT_NAME}" \
            --ref "${CI_REF}" \
            --base "${CI_BASE_SHA}" \
            --head "${CI_HEAD_SHA}" \
            --github-output "${GITHUB_OUTPUT}"
          then
            echo "CI planner failed; enabling all lanes." >&2
            for lane in cmake lint coverage cross_qemu bazel meson xmake; do
              printf 'run_%s=true\n' "${lane}" >> "${GITHUB_OUTPUT}"
            done
          fi

  format:
    needs: plan
    if: ${{ needs.plan.outputs.run_lint == 'true' }}
    name: Clang Format
    runs-on: ubuntu-24.04
    container: fedora:43
    defaults:
      run:
        shell: bash
    steps:
      - name: Install dependencies
        run: |
          set -euxo pipefail
          dnf -y upgrade --refresh
          dnf -y install \
            git \
            which \
            clang-tools-extra

      - name: Checkout
        uses: actions/checkout@v6

      - name: Check C++ formatting
        run: scripts/check_clang_format.sh

  tidy:
    needs: plan
    if: ${{ needs.plan.outputs.run_lint == 'true' }}
    name: Clang Tidy
    runs-on: ubuntu-24.04
    container: fedora:43
    defaults:
      run:
        shell: bash
    steps:
      - name: Install dependencies
        run: |
          set -euxo pipefail
          dnf -y upgrade --refresh
          dnf -y install \
            git \
            which \
            tar \
            xz \
            ninja-build \
            python3 \
            python3-pip \
            pkg-config \
            clang \
            clang-libs \
            clang-devel \
            clang-tools-extra \
            llvm-devel \
            fmt-devel \
            zlib-ng-compat-devel \
            libunwind-devel \
            libcurl-devel \
            libffi-devel \
            libxml2-devel \
            gcc \
            gcc-c++ \
            make \
            ca-certificates
          python3 -m pip install --upgrade pip cmake

      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure
        run: |
          cmake \
            --preset=debug-system \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_MAKE_PROGRAM="$(command -v ninja)" \
            -DLLVM_DIR=/usr/lib64/cmake/llvm \
            -DClang_DIR=/usr/lib64/cmake/clang \
            -DGENTEST_ENABLE_PACKAGE_TESTS=OFF

      - name: Check clang-tidy (configured TUs)
        run: |
          CLANG_TIDY_JOBS=4 scripts/check_clang_tidy.sh build/debug-system
