name: lint

on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
  workflow_call:
    inputs:
      candidate_sha:
        description: Exact candidate commit to test
        required: true
        type: string
      base_sha:
        description: Frozen comparison base
        type: string
        default: ''
      pr_number:
        description: Validated PR number for concurrency isolation
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: lint-${{ inputs.pr_number && format('pr-{0}', inputs.pr_number) || github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Clang Format
    runs-on: ubuntu-24.04
    container: ubuntu:24.04
    defaults:
      run:
        shell: bash
    steps:
      - &build_dependencies
        name: Install build dependencies
        run: |
          set -euxo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            git python3 python3-pip ninja-build build-essential pkg-config \
            libfmt-dev libffi-dev libxml2-dev zlib1g-dev libzstd-dev \
            libcurl4-openssl-dev libunwind-dev
          python3 -m pip install --break-system-packages --upgrade cmake

      - &checkout
        name: Checkout trusted provisioning
        uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - &setup_llvm
        name: Setup LLVM toolchain
        uses: ./.github/actions/setup-llvm

      - name: Checkout candidate
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
          persist-credentials: false

      - name: Check C++ formatting
        run: scripts/check_clang_format.sh

  tidy:
    name: Clang Tidy
    runs-on: ubuntu-24.04
    container: ubuntu:24.04
    defaults:
      run:
        shell: bash
    steps:
      - *build_dependencies
      - *checkout
      - *setup_llvm
      - name: Checkout candidate
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
          persist-credentials: false

      - name: Configure
        run: |
          cmake --preset=debug-system \
            -DCMAKE_C_COMPILER="${CC}" \
            -DCMAKE_CXX_COMPILER="${CXX}" \
            -DCMAKE_MAKE_PROGRAM="$(command -v ninja)" \
            -DLLVM_DIR="${LLVM_DIR}" \
            -DClang_DIR="${Clang_DIR}" \
            -DGENTEST_ENABLE_PACKAGE_TESTS=OFF

      - name: Check clang-tidy (configured TUs)
        run: CLANG_TIDY_JOBS=4 scripts/check_clang_tidy.sh build/debug-system
