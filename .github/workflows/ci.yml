name: CI
run-name: CI (${{ inputs.profile || 'full' }}) — ${{ github.ref_name }}

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      profile:
        description: Test profile (full runs automatically for PRs; pr is an optional manual smoke run)
        type: choice
        options: [full, pr]
        default: full
      base_ref:
        description: Base branch, tag, or commit for the measured comparison
        type: string
        default: master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  profile:
    name: Validate profile
    runs-on: ubuntu-24.04
    outputs:
      profile: ${{ steps.profile.outputs.profile }}
    steps:
      - name: Validate requested profile
        id: profile
        env:
          CI_PROFILE: ${{ inputs.profile || 'full' }}
        run: |
          case "$CI_PROFILE" in
            pr|full) echo "profile=$CI_PROFILE" >> "$GITHUB_OUTPUT" ;;
            *) echo "Unknown CI profile" >&2; exit 1 ;;
          esac
  cmake:
    needs: profile
    uses: ./.github/workflows/cmake.yml
    with:
      profile: ${{ needs.profile.outputs.profile }}
  lint:
    needs: profile
    uses: ./.github/workflows/lint.yml
  coverage:
    needs: profile
    if: ${{ needs.profile.outputs.profile == 'full' }}
    uses: ./.github/workflows/coverage.yml
  cross-qemu:
    needs: profile
    if: ${{ needs.profile.outputs.profile == 'full' }}
    uses: ./.github/workflows/cross_qemu.yml
  buildsystems:
    needs: profile
    if: ${{ needs.profile.outputs.profile == 'full' }}
    uses: ./.github/workflows/buildsystems_linux.yml
  measured:
    needs: profile
    if: ${{ needs.profile.outputs.profile == 'full' }}
    uses: ./.github/workflows/measured_reports.yml
    with:
      base_ref: ${{ inputs.base_ref || github.event.pull_request.base.sha || github.event.before }}
  recording:
    needs: profile
    uses: ./.github/workflows/recording.yml
  clang-leaks:
    needs: profile
    if: ${{ needs.profile.outputs.profile == 'full' }}
    uses: ./.github/workflows/clang_leaks.yml
  full-ci:
    # A manual smoke run must not emit the full-validation check name.
    name: ${{ inputs.profile == 'pr' && 'Smoke CI' || 'Full CI' }}
    if: ${{ always() && (github.event_name == 'pull_request' || inputs.profile != 'pr') }}
    needs: [profile, cmake, lint, coverage, cross-qemu, buildsystems, measured, recording, clang-leaks]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every suite to pass
        env:
          CI_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          # Skips and cancellations cannot satisfy the full validation gate.
          results = json.loads(os.environ["CI_RESULTS"])
          failed = {name: job["result"] for name, job in results.items() if job["result"] != "success"}
          if failed:
              print("Full CI did not pass: " + json.dumps(failed, sort_keys=True), file=sys.stderr)
              sys.exit(1)
          PY
