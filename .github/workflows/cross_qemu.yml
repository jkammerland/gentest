name: cross-qemu

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      candidate_sha:
        description: Exact candidate commit to test
        required: true
        type: string
      base_sha:
        description: Frozen comparison base
        type: string
        default: ''
      pr_number:
        description: Validated PR number for concurrency isolation
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: cross-qemu-${{ inputs.pr_number && format('pr-{0}', inputs.pr_number) || github.ref }}
  cancel-in-progress: true

env:
  CTEST_OUTPUT_ON_FAILURE: 1

  # Match the versions used by the native backend workflow.
  BAZELISK_VERSION: "v1.29.0"
  XMAKE_VERSION: "3.0.8"

  # Both workers run as root in disposable Ubuntu containers.
  XMAKE_ROOT: "y"

jobs:
  linux-aarch64-qemu:
    name: Linux • aarch64 (QEMU)
    runs-on: ubuntu-24.04
    container: ubuntu:24.04
    defaults:
      run:
        shell: bash
    steps:
      - name: Update and install dependencies (apt)
        run: |
          set -euxo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt_common_opts=(-o Acquire::Retries=5 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
          apt_update_opts=("${apt_common_opts[@]}" -o APT::Update::Error-Mode=any)
          apt_update() {
            for attempt in 1 2 3 4 5; do
              apt-get "${apt_update_opts[@]}" update && return 0
              apt-get clean
              rm -rf /var/lib/apt/lists/*
              sleep $((attempt * 10))
            done
            apt-get "${apt_update_opts[@]}" update
          }
          apt_install() {
            for attempt in 1 2 3 4 5; do
              apt-get "${apt_common_opts[@]}" install -y --no-install-recommends "$@" && return 0
              apt-get clean
              rm -rf /var/lib/apt/lists/*
              sleep $((attempt * 10))
              apt_update
            done
            apt-get "${apt_common_opts[@]}" install -y --no-install-recommends "$@"
          }
          apt_update
          apt_install \
            git \
            build-essential \
            ninja-build \
            python3 \
            python3-pip \
            pkg-config \
            meson \
            libfmt-dev \
            curl \
            zip \
            unzip \
            tar \
            ca-certificates \
            qemu-user \
            libc6-dev-arm64-cross \
            libc6-arm64-cross \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu
          python3 -m pip install --break-system-packages --upgrade cmake
          echo "PATH=/usr/local/bin:$PATH" >> "$GITHUB_ENV"

      - name: Checkout trusted provisioning
        uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Setup LLVM toolchain
        uses: ./.github/actions/setup-llvm

      - &install_backend_tools
        name: Install backend validation tools
        run: |
          set -euxo pipefail
          arch="$(uname -m)"
          case "$arch" in
            x86_64) bazelisk_arch="amd64" ;;
            aarch64) bazelisk_arch="arm64" ;;
            *) echo "Unsupported arch: $arch"; exit 1 ;;
          esac

          asset="bazelisk-linux-${bazelisk_arch}"
          base_url="https://github.com/bazelbuild/bazelisk/releases/download/${BAZELISK_VERSION}"
          work_dir="$(mktemp -d)"
          trap 'rm -rf "${work_dir}"' EXIT
          cd "${work_dir}"

          curl --fail --location --show-error --retry 5 --retry-all-errors \
            -o "${asset}" "${base_url}/${asset}"
          curl --fail --location --show-error --retry 5 --retry-all-errors \
            -o "${asset}.sha256" "${base_url}/${asset}.sha256"
          expected_sha256="$(tr -d '[:space:]' < "${asset}.sha256")"
          actual_sha256="$(sha256sum "${asset}")"
          actual_sha256="${actual_sha256%% *}"
          if [[ ! "${expected_sha256}" =~ ^[0-9a-fA-F]{64}$ ]] || [[ "${actual_sha256}" != "${expected_sha256,,}" ]]; then
            echo "Bazelisk checksum mismatch for ${asset}" >&2
            echo "expected: ${expected_sha256}" >&2
            echo "actual:   ${actual_sha256}" >&2
            exit 1
          fi

          install -m 0755 "${asset}" /usr/local/bin/bazelisk
          ln -sf /usr/local/bin/bazelisk /usr/local/bin/bazel
          (cd "${GITHUB_WORKSPACE}" && bazel --version)

          curl --fail --location --show-error --retry 5 --retry-all-errors \
            -o "${work_dir}/xmake" \
            "https://github.com/xmake-io/xmake/releases/download/v${XMAKE_VERSION}/xmake-bundle-v${XMAKE_VERSION}.linux.x86_64"
          install -m 0755 "${work_dir}/xmake" /usr/local/bin/xmake
          xmake --version

      - name: Checkout candidate
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
          persist-credentials: false

      - name: Configure environment variables
        run: |
          set -euxo pipefail
          echo "HOST_CLANG=${CC}" >> "$GITHUB_ENV"
          echo "HOST_CLANGXX=${CXX}" >> "$GITHUB_ENV"
          echo "CMAKE_GENERATOR=Ninja" >> "$GITHUB_ENV"

      - name: Show tool versions
        run: |
          set -euxo pipefail
          cmake --version
          ninja --version
          meson --version
          bazel --version
          xmake --version
          pkg-config --modversion fmt
          ${HOST_CLANG} --version
          aarch64-linux-gnu-gcc --version | head -n 1
          qemu-aarch64 --version | head -n 1
          if command -v llvm-config >/dev/null 2>&1; then llvm-config --version; fi

      - name: Configure host codegen (native)
        run: |
          set -euxo pipefail
          cmake --preset=host-codegen \
            -DCMAKE_C_COMPILER=${HOST_CLANG} \
            -DCMAKE_CXX_COMPILER=${HOST_CLANGXX} \
            -DLLVM_DIR=${LLVM_DIR} \
            -DClang_DIR=${Clang_DIR}

      - name: Build host codegen (native)
        run: |
          set -euxo pipefail
          cmake --build --preset=host-codegen --parallel

      - name: Configure cross build (Linux/aarch64)
        run: |
          set -euxo pipefail
          aarch64-linux-gnu-gcc -print-sysroot
          loader="$(aarch64-linux-gnu-gcc -print-file-name=ld-linux-aarch64.so.1)"
          libc="$(aarch64-linux-gnu-gcc -print-file-name=libc.so.6)"
          echo "aarch64 loader: ${loader}"
          echo "aarch64 libc: ${libc}"
          test -e "${loader}"
          test -e "${libc}"

          cmake --preset=aarch64-qemu \
            -DGENTEST_CODEGEN_HOST_CLANG=${GENTEST_CODEGEN_HOST_CLANG}

      - name: Build cross target (Linux/aarch64)
        run: |
          set -euxo pipefail
          cmake --build --preset=aarch64-qemu-full --parallel

      - name: Test (QEMU full suite)
        run: |
          set -euxo pipefail
          ctest --preset=aarch64-qemu-full --output-on-failure --no-tests=error

  linux-riscv64-qemu:
    name: Linux • riscv64 (QEMU)
    runs-on: ubuntu-24.04
    container: ubuntu:24.04
    defaults:
      run:
        shell: bash
    steps:
      - name: Update and install dependencies (apt)
        run: |
          set -euxo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt_common_opts=(-o Acquire::Retries=5 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
          apt_update_opts=("${apt_common_opts[@]}" -o APT::Update::Error-Mode=any)
          apt_update() {
            for attempt in 1 2 3 4 5; do
              apt-get "${apt_update_opts[@]}" update && return 0
              apt-get clean
              rm -rf /var/lib/apt/lists/*
              sleep $((attempt * 10))
            done
            apt-get "${apt_update_opts[@]}" update
          }
          apt_install() {
            for attempt in 1 2 3 4 5; do
              apt-get "${apt_common_opts[@]}" install -y --no-install-recommends "$@" && return 0
              apt-get clean
              rm -rf /var/lib/apt/lists/*
              sleep $((attempt * 10))
              apt_update
            done
            apt-get "${apt_common_opts[@]}" install -y --no-install-recommends "$@"
          }
          apt_update
          apt_install \
            git \
            build-essential \
            ninja-build \
            python3 \
            python3-pip \
            pkg-config \
            meson \
            libfmt-dev \
            curl \
            zip \
            unzip \
            tar \
            ca-certificates \
            qemu-user \
            libc6-dev-riscv64-cross \
            libc6-riscv64-cross \
            gcc-riscv64-linux-gnu \
            g++-riscv64-linux-gnu
          python3 -m pip install --break-system-packages --upgrade cmake
          echo "PATH=/usr/local/bin:$PATH" >> "$GITHUB_ENV"

      - name: Checkout trusted provisioning
        uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Setup LLVM toolchain
        uses: ./.github/actions/setup-llvm

      - *install_backend_tools

      - name: Checkout candidate
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
          persist-credentials: false

      - name: Configure environment variables
        run: |
          set -euxo pipefail
          echo "HOST_CLANG=${CC}" >> "$GITHUB_ENV"
          echo "HOST_CLANGXX=${CXX}" >> "$GITHUB_ENV"
          echo "CMAKE_GENERATOR=Ninja" >> "$GITHUB_ENV"

      - name: Show tool versions
        run: |
          set -euxo pipefail
          cmake --version
          ninja --version
          meson --version
          bazel --version
          xmake --version
          pkg-config --modversion fmt
          ${HOST_CLANG} --version
          riscv64-linux-gnu-gcc --version | head -n 1
          qemu-riscv64 --version | head -n 1
          if command -v llvm-config >/dev/null 2>&1; then llvm-config --version; fi

      - name: Configure host codegen (native)
        run: |
          set -euxo pipefail
          cmake --preset=host-codegen \
            -DCMAKE_C_COMPILER=${HOST_CLANG} \
            -DCMAKE_CXX_COMPILER=${HOST_CLANGXX} \
            -DLLVM_DIR=${LLVM_DIR} \
            -DClang_DIR=${Clang_DIR}

      - name: Build host codegen (native)
        run: |
          set -euxo pipefail
          cmake --build --preset=host-codegen --parallel

      - name: Configure cross build (Linux/riscv64)
        run: |
          set -euxo pipefail
          sysroot="$(riscv64-linux-gnu-gcc -print-sysroot)"
          loader="$(riscv64-linux-gnu-gcc -print-file-name=ld-linux-riscv64-lp64d.so.1)"
          libc="$(riscv64-linux-gnu-gcc -print-file-name=libc.so.6)"
          if [ -z "${loader}" ] || [ "${loader}" = "ld-linux-riscv64-lp64d.so.1" ] || [ ! -e "${loader}" ]; then
            for candidate in \
              "${sysroot}/lib/ld-linux-riscv64-lp64d.so.1" \
              "${sysroot}/lib64/ld-linux-riscv64-lp64d.so.1" \
              "/usr/riscv64-linux-gnu/lib/ld-linux-riscv64-lp64d.so.1" \
              "/usr/riscv64-linux-gnu/lib64/ld-linux-riscv64-lp64d.so.1"
            do
              if [ -e "${candidate}" ]; then
                loader="${candidate}"
                break
              fi
            done
          fi
          if [ -z "${libc}" ] || [ "${libc}" = "libc.so.6" ] || [ ! -e "${libc}" ]; then
            for candidate in \
              "${sysroot}/lib/libc.so.6" \
              "${sysroot}/lib64/libc.so.6" \
              "/usr/riscv64-linux-gnu/lib/libc.so.6" \
              "/usr/riscv64-linux-gnu/lib64/libc.so.6"
            do
              if [ -e "${candidate}" ]; then
                libc="${candidate}"
                break
              fi
            done
          fi
          echo "riscv64 sysroot: ${sysroot}"
          echo "riscv64 loader: ${loader}"
          echo "riscv64 libc: ${libc}"
          test -d "${sysroot}"
          test -e "${loader}"
          test -e "${libc}"

          cmake --preset=riscv64-qemu \
            -DGENTEST_CODEGEN_HOST_CLANG=${GENTEST_CODEGEN_HOST_CLANG}

      - name: Build cross target (Linux/riscv64)
        run: |
          set -euxo pipefail
          cmake --build --preset=riscv64-qemu-full --parallel

      - name: Test (QEMU full suite)
        run: |
          set -euxo pipefail
          ctest --preset=riscv64-qemu-full --output-on-failure --no-tests=error
